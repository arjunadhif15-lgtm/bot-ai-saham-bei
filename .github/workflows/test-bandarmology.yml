
name: Test Bandarmology TOP 10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bandarmology:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang library
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Jalankan pengujian Bandarmology
        env:
          IDX_EDGE_API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u bandarmology.py
