name: Scan Otomatis Saham BEI

on:
  schedule:
    - cron: "20 9 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-saham-bei
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang library
        run: python -m pip install -r requirements.txt

      - name: Periksa file scanner
        run: |
          echo "Direktori kerja:"
          pwd
          echo "Daftar file:"
          ls -la
          echo "Memeriksa file yang diperlukan..."
          test -f scanner.py
          test -f app.py
          test -f requirements.txt
          test -f sent_notifications.json
          echo "Semua file ditemukan."

      - name: Jalankan scan saham
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ./scanner.py

      - name: Simpan catatan notifikasi harian
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_notifications.json
          if ! git diff --cached --quiet; then
            git commit -m "Simpan status notifikasi saham"
          fi
          git push
